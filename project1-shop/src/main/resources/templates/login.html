<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, member-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="/main.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{nav.html::navbar}"></div>
<div class="container mt-5" style="max-width:500px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="text-center mb-4">로그인</h3>
            <div th:if="${param.error}">
                <h3> 아이디 또는 비밀번호가 틀렸습니다.</h3>
            </div>
            <form action="/login" method="post">
                <label>아이디</label><input type="text" name="username" placeholder="아이디를 입력하세요" required><br>
                <label>비밀번호</label><input type="password" name="password" placeholder="비밀번호를 입력하세요" required><br>
                <button type="submit">로그인</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
